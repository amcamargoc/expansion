name: "Orchestrator Agent Workflow"

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Command or prompt for the orchestrator agent'
        required: true
        type: string
      agent:
        description: 'Target sub-agent (default: orchestrator)'
        required: false
        type: string
        default: 'orchestrator'

jobs:
  orchestrate:
    name: Run Agent Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Agent Setup & Execution
        run: |
          echo "Starting the agent workflow..."
          echo "Prompt Received: ${{ github.event.inputs.prompt }}"
          echo "Target Agent: ${{ github.event.inputs.agent }}"

          # Placeholder for the actual CLI tool that handles the agentic flow
          # e.g., npx run-agent --target ${{ github.event.inputs.agent }} --prompt "${{ github.event.inputs.prompt }}"

          echo "Agent has completed its reasoning loop."

      - name: Report Status
        if: always()
        run: |
          echo "Workflow finished. Check outputs for any Linear issue updates or PR creation."
